name: استقرار روی سرور

# تا وقتی متغیر DEPLOY_ENABLED روی 'true' تنظیم نشده باشد، این ورک‌فلو کاری نمی‌کند.
# مسیر فعال‌سازی پس از تهیه سرور:
#   Settings ← Secrets and variables ← Actions
#     Variables: DEPLOY_ENABLED = true
#     Secrets:   SSH_HOST, SSH_USER, SSH_KEY, (اختیاری) SSH_PORT, DEPLOY_PATH
#
# معماری: composer install و npm build اینجا روی رانر گیت‌هاب اجرا می‌شوند
# (شبکه سریع و پایدار)، نه روی خود سرور. فقط خروجی آماده (vendor/ و
# public/build/) با rsync به سرور منتقل می‌شود. علتش یک حادثه واقعی است:
# اتصال این سرور به npm registry چند بار در وسط «npm ci» بی‌صدا گیر کرد
# و سایت در حالت تعمیر ماند. سرور دیگر هیچ‌وقت مستقیم با npm/Packagist
# صحبت نمی‌کند — فقط با گیت‌هاب (که قبلاً پایدار اثبات شده) و rsync از
# همین رانر.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: بیلد در Actions + استقرار روی سرور
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: بررسی تنظیم بودن اسرارها
        run: |
          for name in SSH_HOST SSH_USER SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::سکرت $name تنظیم نشده است."
              exit 1
            fi
          done
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - uses: actions/checkout@v4

      - name: نصب PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: composer install (روی رانر گیت‌هاب)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: نصب Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: بیلد فرانت‌اند (روی رانر گیت‌هاب)
        run: |
          npm ci
          npm run build

      - name: آماده‌سازی کلید SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: حالت تعمیر
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" -o ConnectTimeout=15 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "cd '${DEPLOY_PATH:-/var/www/barghishop}' && php artisan down --retry=15" || true
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: انتقال vendor و فایل‌های بیلدشده با rsync
        run: |
          RSYNC_SSH="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          DEST="${DEPLOY_PATH:-/var/www/barghishop}"
          TARGET="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          rsync -az --delete -e "$RSYNC_SSH" vendor/ "$TARGET:$DEST/vendor/"
          rsync -az --delete -e "$RSYNC_SSH" public/build/ "$TARGET:$DEST/public/build/"
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: اجرای استقرار روی سرور
        run: |
          # این قدم دیگر composer/npm صدا نمی‌زند — فقط git (منبع، سبک و
          # قبلاً پایدار اثبات‌شده)، مهاجرت دیتابیس و کش، همه محلی و سریع.
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "DEPLOY_PATH='${DEPLOY_PATH:-/var/www/barghishop}' bash -s" <<'SCRIPT'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          echo "▶ استقرار در $DEPLOY_PATH"

          git fetch --prune origin main
          git reset --hard origin/main

          php artisan migrate --force

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan storage:link || true

          php artisan up

          echo "✔ استقرار انجام شد: $(git rev-parse --short HEAD)"
          SCRIPT
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: اطمینان از بالا بودن سایت (همیشه اجرا می‌شود)
        # صرف‌نظر از موفق یا ناموفق بودن قدم بالا، این قدم تضمین می‌کند
        # سایت هرگز در حالت تعمیر باقی نماند.
        if: always()
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
              -o ConnectTimeout=15 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "cd '${DEPLOY_PATH:-/var/www/barghishop}' && php artisan up" || true
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: بررسی سلامت سایت
        if: always()
        run: |
          URL="${HEALTH_URL:-https://barghishop.com}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" 2>/dev/null) || CODE="000"
          echo "پاسخ $URL → $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::سایت پاسخ ۲۰۰ نداد (کد $CODE). لطفاً دستی بررسی کنید."
          fi
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
